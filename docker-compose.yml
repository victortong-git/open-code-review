services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: opencodereview
      POSTGRES_DB_TEST: opencodereview_test
    volumes:
      - ./pgsql_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - reviewnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:adminpass@db:5432/opencodereview
      DATABASE_URL_TEST: postgresql://admin:adminpass@db:5432/opencodereview_test
      NODE_ENV: development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ./projects:/usr/src/app/projects
    networks:
      - reviewnet
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - reviewnet
    environment:
      VITE_API_URL: http://localhost:8001/api

  nemo-agent-toolkit-ui:
    build:
      context: .
      dockerfile: ./aiqtoolkit-ui/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - reviewnet
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_HTTP_CHAT_COMPLETION_URL: "http://nvidia-nat:8000/chat/stream"
      NEXT_PUBLIC_WEBSOCKET_CHAT_COMPLETION_URL: "ws://nvidia-nat:8000/websocket"
      NEXT_PUBLIC_WEB_SOCKET_DEFAULT_ON: "true"
      NEXT_PUBLIC_ENABLE_INTERMEDIATE_STEPS: "true"


  nvidia-nat:
    build:
      context: .
      dockerfile: ./Dockerfile-nemo_agent_toolkit
    volumes:
      - ./logs:/workspace/logs
      - ./projects:/workspace/.tmp/projects
      - ./my-agents:/workspace/my-agents
      - ./ollama_provider:/workspace/ollama_provider
    working_dir: /workspace
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PATH=/workspace/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      - PYTHONPATH=/workspace:/workspace/src
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - NVIDIA_MODEL=${NVIDIA_MODEL}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_PORT=${OLLAMA_PORT}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - OLLAMA_HOST=localhost
    ports:
      - "8000:8000"
    command: ["bash", "-c", "cd /workspace && source .venv/bin/activate && nat serve --config_file=my-agents/open_code_review/src/open_code_review/configs/config.yml --port 8000 --host 0.0.0.0"]
    networks:
      - reviewnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true

  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    networks:
      - reviewnet
    volumes:
      - ./mcp_server:/app
    depends_on:
      - backend

networks:
  reviewnet:
    driver: bridge

